name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Until orbits-go v0.1.0 is published (and go.sum has it), build against
      # its main branch through a workspace outside the repository.
      - name: Use an orbits-go checkout if it is not published yet
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^github.com/The-Orbits/orbits-go ' go.sum; then
            echo "orbits-go comes from go.sum"; exit 0
          fi
          git clone --depth 1 https://github.com/The-Orbits/orbits-go "$RUNNER_TEMP/orbits-go"
          cat > "$RUNNER_TEMP/go.work" <<WORK
          go 1.27.1
          use $GITHUB_WORKSPACE
          use $RUNNER_TEMP/orbits-go
          replace github.com/The-Orbits/orbits-go v0.1.0 => $RUNNER_TEMP/orbits-go
          WORK
          echo "GOWORK=$RUNNER_TEMP/go.work" >> "$GITHUB_ENV"

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test -race ./...

      # Every platform install.sh offers must still build.
      - run: make dist VERSION=ci

      - name: install.sh parses
        run: bash -n install.sh

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
