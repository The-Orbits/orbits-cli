name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test -race ./...

      # Every platform install.sh offers must still build.
      - run: make dist VERSION=ci

      # And the npm packages made from them must install and run.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: make npm VERSION=ci

      - name: install.sh parses
        run: bash -n install.sh

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
