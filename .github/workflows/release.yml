name: Release

# Push a tag to release:  git tag v0.1.0 && git push origin v0.1.0
# GoReleaser builds macOS and Linux (amd64, arm64), publishes the archives and
# checksums.txt on the GitHub release, and updates the cask in
# The-Orbits/homebrew-tap. Then the npm job publishes @useorbits/cli and its
# four platform packages, built from that release's own archives.
# A tag with a hyphen (v0.2.0-rc.1) is a pre-release: not "latest", the cask
# stays where it was, and npm gets it under the dist-tag "next".
#
# Needs the secret HOMEBREW_TAP_TOKEN: a token that may push to
# The-Orbits/homebrew-tap (nothing else). npm is authenticated by trusted
# publishing (OIDC): each of the five packages names this workflow
# (release.yml) as its trusted publisher on npmjs.com, so no npm token is kept
# here. The very first publish of a package, before it exists to be
# configured, can use the secret NPM_TOKEN instead; delete it afterwards.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # A release is built from go.sum alone: no workspace, no replace.
      - name: orbits-go is a published version
        run: |
          grep -q '^github.com/The-Orbits/orbits-go ' go.sum || {
            echo "::error::go.sum has no orbits-go: publish it, then run go get github.com/The-Orbits/orbits-go@<version> && go mod tidy"; exit 1; }

      - name: CHANGELOG.md has this version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          case "$VERSION" in
            *-*) echo "a pre-release: no changelog section needed"; echo "Pre-release $VERSION." > "$RUNNER_TEMP/notes.md" ;;
            *)
              grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
              awk -v v="## $VERSION " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
              ;;
          esac

      - run: go vet ./...

      - run: go test -race ./...

      - run: bash -n install.sh

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Separate from the release, so a failed publish can be re-run on its own: it
  # skips any package version already on npm.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Download the release's archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'orbits_*.tar.gz' --pattern checksums.txt

      - name: Build the packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node npm/build.mjs --version "$TAG" --dist dist --out dist/npm
          npm/smoke.sh dist/npm

      # Platform packages first (build.mjs lists them first), so @useorbits/cli
      # never points at versions that are not published yet.
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          case "$TAG" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          for dir in dist/npm/cli-* dist/npm/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"; continue
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$dist_tag")
          done
